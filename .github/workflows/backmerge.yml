name: Back-merge main into develop

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backmerge
  cancel-in-progress: false

jobs:
  backmerge:
    runs-on: ubuntu-latest
    steps:
      # The push authenticates with a write deploy key (BACKMERGE_SSH_KEY)
      # instead of GITHUB_TOKEN: personal-account rulesets cannot put the
      # GitHub Actions app on their bypass list, but they can exempt deploy
      # keys. Unlike a GITHUB_TOKEN push, a deploy-key push does trigger
      # ci.yml on develop, so each release re-runs CI + staging deploy there
      # (redundant but harmless: the content is identical to what CI already
      # passed on the release PR). It cannot loop back here, because this
      # workflow only fires on pushes to main.
      - uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0
          ssh-key: ${{ secrets.BACKMERGE_SSH_KEY }}

      - name: Merge main into develop
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge origin/main -m "chore: back-merge main into develop"
          git push origin develop
