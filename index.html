<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" sizes="32x32" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Default title for non-JS crawlers and the pre-mount paint. RouteHead
         renders a per-route <title> at runtime, and React 19 hoists it ahead of
         this one; RouteHead then removes everything marked data-default, so the
         live document carries exactly one title while the served HTML keeps
         this fallback for crawlers that never run a script. -->
    <title data-default>DiceTable: Build, compare and balance dice rolls</title>
    <meta name="theme-color" content="#f2f1ed" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131519" media="(prefers-color-scheme: dark)" />

    <!-- Applies the saved color mode and the has-rolls state before first
         paint, so the pre-mount frame matches the app instead of flashing.
         See public/boot.js for what it does and why it is a file: the
         deployed Content-Security-Policy is `script-src 'self'` with no
         'unsafe-inline', so an inline block here is blocked and runs nowhere.
         Plain and synchronous on purpose; defer or type=module would put it
         after the paint it exists to fix. -->
    <script src="/boot.js"></script>

    <!-- Pre-mount styles only. Chakra isn't loaded yet, so these hardcode the
         theme's resolved values (bg / fg / fg.muted, Inter stack, container
         metrics) as hex; this file is one of the three places hex is allowed,
         beside theme.ts and palette.ts. `.preboot` exists only in the static
         markup below and disappears when React replaces #root, so nothing here
         can leak into the mounted app. -->
    <style>
      body {
        margin: 0;
      }
      html {
        background-color: #f2f1ed;
      }
      html.dark {
        background-color: #131519;
        color-scheme: dark;
      }
      .preboot {
        box-sizing: border-box;
        /* navbar 52px + page padding (12 at base, 16 from md), so the copy lands
           where TablePage renders it */
        padding: 64px 12px 12px;
        font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI',
          Helvetica, Arial, sans-serif;
        color: #22221f;
      }
      html.dark .preboot {
        color: #e4e7eb;
      }
      .preboot h1 {
        margin: 0;
        font-size: 1rem;
        line-height: 1.5rem;
        font-weight: 600;
        letter-spacing: -0.025em;
      }
      html.has-rolls .preboot h1,
      html.has-rolls .preboot p,
      html.recipe-route .preboot h1,
      html.recipe-route .preboot p {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
      }
      .preboot p {
        margin: 4px 0 0;
        max-width: 620px;
        font-size: 0.75rem;
        line-height: 1.125rem;
        color: #5c5952;
        text-wrap: pretty;
        /* TablePage clamps this to two lines on a phone, so the pre-mount paint
           has to stop at the same line or everything under it moves. */
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        overflow: hidden;
      }
      html.dark .preboot p {
        color: #a5acb6;
      }
      @media (min-width: 48em) {
        .preboot {
          padding: 68px 12px 16px;
        }
        .preboot h1 {
          font-size: 1.25rem;
          line-height: 1.875rem;
        }
        .preboot p {
          font-size: 0.875rem;
          line-height: 1.3125rem;
          display: block;
          -webkit-line-clamp: none;
          overflow: visible;
        }
      }
    </style>

    <!-- Link previews (Slack, Discord, X, iMessage and the rest) never run a
         script, so this is all they ever read, for every URL on the site. The
         card art, type and site name are global and stay. The title and
         description below are the homepage's, as fallbacks: RouteHead renders a
         route's own and removes these (data-default), so the live document
         holds exactly one of each. -->
    <meta name="description" content="Build dice rolls for any tabletop game or your own homebrew. Compare them side by side, see the exact odds of every result, and balance them." data-default />
    <meta property="og:title" content="DiceTable: Build, compare and balance dice rolls" data-default />
    <meta property="og:description" content="Build dice rolls for any tabletop game or your own homebrew. Compare them side by side, see the exact odds of every result, and balance them." data-default />
    <meta name="twitter:title" content="DiceTable: Build, compare and balance dice rolls" data-default />
    <meta name="twitter:description" content="Build dice rolls for any tabletop game or your own homebrew. Compare them side by side, see the exact odds of every result, and balance them." data-default />
    <meta property="og:site_name" content="DiceTable" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://dice-table.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="DiceTable logo on a light background" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://dice-table.app/og-image.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "DiceTable",
        "url": "https://dice-table.app/",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript",
        "description": "Build and balance dice rolls for existing games and homebrew mechanics, and compare them by exact probability, not simulation. Score rolls as sums, success pools or checks with effects, read mean, spread, range and hit chance, overlay PMF, CDF and CCDF curves, rank them by target, roll-off or head to head, and share as a link or image.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "creator": {
          "@type": "Person",
          "name": "DevZan"
        }
      }
    </script>
  </head>
  <body>
    <!-- Pre-mount hero: the only homepage content non-JS crawlers see, styled
         by the inline .preboot rules above so the pre-React paint matches the
         app. React clears #root and renders TablePage on mount, which shows
         this same copy while the table is empty and keeps the h1 in the
         accessibility tree once it has rows. The has-rolls class set above
         clips this copy in the case where the mounted app will hide it, so
         either way the pre-mount paint matches what mounts. Keep the two
         strings in sync with TablePage to avoid a content flash. -->
    <div id="root">
      <main class="preboot">
        <h1>Build, compare and balance dice rolls</h1>
        <p>
          Make a table of rolls from any game or your own homebrew, then see
          their exact odds on one chart.
        </p>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
